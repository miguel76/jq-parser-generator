name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.8.1 is the reference; 1.7 (Ubuntu's package) stays supported.
        # 1.8.0 is skipped on purpose: its reduce/foreach regression
        # (reverted in 1.8.1) makes parsing quadratic.
        # gojq has no --run-tests; tests/run_tests.py emulates it.
        jq: ["1.8.1", "apt", "gojq-0.12.20"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jq (Ubuntu package)
        if: matrix.jq == 'apt'
        run: sudo apt-get update && sudo apt-get install -y jq && jq --version
      - name: Install jq ${{ matrix.jq }} (release binary)
        if: matrix.jq != 'apt' && !startsWith(matrix.jq, 'gojq-')
        run: |
          sudo curl -fsSL -o /usr/local/bin/jq \
            "https://github.com/jqlang/jq/releases/download/jq-${{ matrix.jq }}/jq-linux-amd64"
          sudo chmod +x /usr/local/bin/jq
          hash -r && jq --version
      - uses: actions/setup-go@v5
        if: startsWith(matrix.jq, 'gojq-')
        with:
          go-version: stable
      - name: Install ${{ matrix.jq }}
        if: startsWith(matrix.jq, 'gojq-')
        run: |
          go install "github.com/itchyny/gojq/cmd/gojq@v${MATRIX_JQ#gojq-}"
          echo "JQ=$(go env GOPATH)/bin/gojq" >> "$GITHUB_ENV"
          "$(go env GOPATH)/bin/gojq" --version
        env:
          MATRIX_JQ: ${{ matrix.jq }}
      - name: Functional tests (jq --run-tests, emulated on gojq)
        run: make test-jq
      - name: All tests incl. resource monitoring
        env:
          # shared CI runners are slower / noisier than a dev machine
          JQPG_PERF_SLACK: "3"
          JQPG_PERF_REPORT: perf-report.json
        run: make test
      - name: Upload resource report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-jq-${{ matrix.jq }}
          path: perf-report.json
